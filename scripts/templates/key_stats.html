<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #fff;
    padding: 48px 56px;
    color: #1E293B;
  }
  .header { text-align: center; margin-bottom: 40px; }
  .header h1 { font-size: 32px; font-weight: 700; color: #0F2B48; margin-bottom: 8px; }
  .header p { font-size: 16px; color: #475569; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }
  .stat-card {
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    padding: 28px;
    text-align: center;
    border-top: 4px solid #2563EB;
  }
  .stat-value {
    font-size: 48px;
    font-weight: 800;
    color: #2563EB;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .stat-label {
    font-size: 16px;
    font-weight: 600;
    color: #0F2B48;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-detail {
    font-size: 14px;
    color: #475569;
    line-height: 1.5;
  }
</style>
</head><body>
  <div class="header">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
  </div>
  <div class="stats-grid">
    {% for stat in stats %}
    <div class="stat-card">
      <div class="stat-value">{{ stat.value }}</div>
      <div class="stat-label">{{ stat.label }}</div>
      <div class="stat-detail">{{ stat.detail }}</div>
    </div>
    {% endfor %}
  </div>
</body></html>
