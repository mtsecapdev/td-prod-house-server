<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #fff;
    padding: 48px 56px;
    color: #1E293B;
  }
  .header { text-align: center; margin-bottom: 40px; }
  .header h1 { font-size: 32px; font-weight: 700; color: #0F2B48; margin-bottom: 8px; }
  .header p { font-size: 16px; color: #475569; }
  .steps { display: flex; flex-direction: column; gap: 0; }
  .step-row {
    display: flex;
    align-items: stretch;
    gap: 0;
  }
  .step-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 56px;
    flex-shrink: 0;
  }
  .step-number {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #2563EB;
    color: #fff;
    font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-line {
    width: 3px;
    flex: 1;
    background: #CBD5E1;
    min-height: 16px;
  }
  .step-row:last-child .step-line { display: none; }
  .step-content {
    flex: 1;
    padding: 6px 0 28px 20px;
  }
  .step-label {
    font-size: 18px; font-weight: 600; color: #0F2B48;
    margin-bottom: 4px;
  }
  .step-description {
    font-size: 15px; color: #475569; line-height: 1.5;
  }
</style>
</head><body>
  <div class="header">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
  </div>
  <div class="steps">
    {% for step in steps %}
    <div class="step-row">
      <div class="step-indicator">
        <div class="step-number">{{ step.number }}</div>
        <div class="step-line"></div>
      </div>
      <div class="step-content">
        <div class="step-label">{{ step.label }}</div>
        <div class="step-description">{{ step.description }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</body></html>
