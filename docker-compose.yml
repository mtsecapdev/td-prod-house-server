services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tdph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tdph
      POSTGRES_PASSWORD: tdph
      POSTGRES_DB: tdph
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdph -d tdph"]
      interval: 5s
      retries: 10

  docling:
    # CUDA 13 build; use quay.io/docling-project/docling-serve-cpu:v1.38.2 on machines without an NVIDIA GPU
    # (and remove the deploy block).
    image: quay.io/docling-project/docling-serve-cu130:v1.38.2
    container_name: tdph-docling
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      start_period: 60s
      retries: 10

  renderer:
    # Mermaid -> PNG for diagram slides and document figures. One long-lived Chromium with a page pool;
    # RENDER_POOL_SIZE caps concurrent renders.
    build:
      context: .
      dockerfile: renderer/Dockerfile
    image: tdph-renderer
    container_name: tdph-renderer
    restart: unless-stopped
    init: true
    environment:
      RENDER_POOL_SIZE: "4"
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      start_period: 20s
      retries: 5

volumes:
  pgdata:
