services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tdph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tdph
      POSTGRES_PASSWORD: tdph
      POSTGRES_DB: tdph
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdph -d tdph"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
